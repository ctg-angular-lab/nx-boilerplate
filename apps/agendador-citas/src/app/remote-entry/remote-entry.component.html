<div class="agendador-citas-view-container">
  <!-- Colección de pestañas modular con preservación de estado del DOM -->
  <app-tabs-collection
    [tabs]="tabs()"
    [preserveContent]="true"
    [activeTabId]="appointmentLogic.activeTab()"
    (activeTabIdChange)="onActiveTabChange($event)"
  />

  <!-- Template para Tab 1: Agendar Cita -->
  <ng-template #appointmentTab>
    <div class="tab-pane-wrapper">
      <app-agendar-cita />
    </div>
  </ng-template>

  <!-- Template para Tab 2: Calendario -->
  <ng-template #calendarTab>
    <div class="tab-pane-wrapper">
      <app-calendario-citas />
    </div>
  </ng-template>

  <!-- Template para Tab 3: Confirmación de Citas -->
  <ng-template #confirmationTab>
    <div class="tab-pane-wrapper">
      <app-confirmacion-citas />
    </div>
  </ng-template>
</div>
