<section class="calendar-card">
  <!-- Cabecera del Calendario (Fase 1) -->
  <header class="calendar-header">
    <div class="calendar-header__info">
      <h3 class="calendar-header__title">{{ title() }}</h3>
      <p class="calendar-header__range">{{ currentDateRange() }}</p>
    </div>

    <div class="calendar-header__actions">
      <button
        mat-stroked-button
        type="button"
        class="calendar-header__btn-today"
        (click)="goToToday()"
      >
        Hoy
      </button>

      <div class="calendar-header__nav-group">
        <button
          mat-icon-button
          type="button"
          aria-label="Semana anterior"
          (click)="previousWeek()"
        >
          <mat-icon class="material-symbols-outlined">chevron_left</mat-icon>
        </button>

        <button
          mat-icon-button
          type="button"
          aria-label="Semana siguiente"
          (click)="nextWeek()"
        >
          <mat-icon class="material-symbols-outlined">chevron_right</mat-icon>
        </button>
      </div>
    </div>
  </header>

  <!-- Grid del Calendario (Fase 2) -->
  <div class="calendar-grid-wrapper">
    <div class="calendar-grid">
      @for (day of weekDays(); track day.date.toISOString()) {
        <div
          class="calendar-column"
          [class.calendar-column--today]="day.isToday"
          [class.calendar-column--unavailable]="day.isAvailable === false"
        >
          <div class="calendar-column__header">
            <span class="calendar-column__day-label">{{ day.label }}</span>
            <span class="calendar-column__date-label">{{ day.subLabel }}</span>
          </div>

          @if (day.isAvailable === false) {
            <div class="calendar-column__unavailable" aria-label="Día no disponible">
              <mat-icon class="material-symbols-outlined calendar-column__unavailable-icon">
                event_busy
              </mat-icon>
              <span class="calendar-column__unavailable-text">No disponible</span>
            </div>
          } @else {
            <div class="calendar-column__slots">
              @for (slot of day.slots; track slot.id) {
                <button
                  type="button"
                  class="time-slot"
                  [class.time-slot--disponible]="slot.status === 'disponible' && !isSlotSelected(slot)"
                  [class.time-slot--reservado]="slot.status === 'reservado'"
                  [class.time-slot--seleccionado]="isSlotSelected(slot)"
                  [disabled]="slot.status === 'reservado'"
                  (click)="onSlotClick(slot)"
                >
                  <span class="time-slot__time">{{ slot.time }}</span>
                  @if (slot.status === 'reservado' && slot.reservedBy) {
                    <span class="time-slot__reserved-by">{{ slot.reservedBy }}</span>
                  }
                </button>
              }
            </div>
          }
        </div>
      }
    </div>
  </div>

  <!-- Leyenda Inferior (Fase 2) -->
  <footer class="calendar-legend">
    <div class="calendar-legend__item">
      <span class="legend-swatch legend-swatch--disponible"></span>
      <span class="calendar-legend__label">Disponible</span>
    </div>
    <div class="calendar-legend__item">
      <span class="legend-swatch legend-swatch--reservado"></span>
      <span class="calendar-legend__label">No disponible</span>
    </div>
    <div class="calendar-legend__item">
      <span class="legend-swatch legend-swatch--seleccionado"></span>
      <span class="calendar-legend__label">Seleccionado</span>
    </div>
  </footer>
</section>
